<!doctype html>
<!--
	Arcade-marquee poster: a cool graphite ground and a two-colour marquee palette (bulb yellow, poster red), with a diagonal block holding the logotype the way box art holds a title.

	Anything in double braces is filled in when the page is generated — your
	name, your work, your links — and is already gone by the time you have
	this file. Everything else is ordinary HTML: rearrange it, retitle it, or
	delete a section you do not want.

	Two things to leave alone: the verification meta tag in the head, which is
	how IndieNodes confirms this site is yours until your submission is
	approved, and the link to styles.css, which is where all the styling for
	this page lives.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		{{VERIFICATION_META}}
		<title>{{DISPLAY_NAME}}</title>
		<link rel="stylesheet" href="styles.css" />
		{{COLOR_OVERRIDE}}
	</head>
	<body>
		<main class="poster{{POSTER_MODIFIER}}" {{POSTER_ART_STYLE}}>
			<div class="art" role="img" aria-label="{{ART_LABEL}}"></div>
			<div class="marquee">
				{{ICON}}
				<h1>{{DISPLAY_NAME}}</h1>
				<p class="tagline">{{WHY}}</p>
				<a class="play-button" href="#" data-role="visit">Play</a>
			</div>
		</main>

		{{SOCIAL_LINKS}}

		<footer>
			<p>Independently made.</p>
			{{WIDGET_EMBED}}
		</footer>
		<script src="script.js"></script>
	</body>
</html>
