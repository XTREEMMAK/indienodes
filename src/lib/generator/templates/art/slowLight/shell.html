<!doctype html>
<!--
	Ambient layout: a restrained full-screen dissolve between works, with attribution that stays put through it.

	Anything in double braces is filled in when the page is generated — your
	name, your work, your links — and is already gone by the time you have
	this file. Everything else is ordinary HTML: rearrange it, retitle it, or
	delete a section you do not want.

	Two things to leave alone: the verification meta tag in the head, which is
	how IndieNodes confirms this site is yours until your submission is
	approved, and the link to styles.css, which is where all the styling for
	this page lives.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		{{VERIFICATION_META}}{{ACCENT_OVERRIDE}}
		<title>{{DISPLAY_NAME}} — Slow Light</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<main class="stage" aria-label="Selected artwork by {{DISPLAY_NAME}}">{{ARTWORKS}}</main>
		<header>
			<div class="identity">
				{{ICON}}
				<div>
					<span>Artwork by</span>
					<h1>{{DISPLAY_NAME}}</h1>
				</div>
			</div>
			<p>{{WHY}}</p>
		</header>
		<aside>
			<p>{{BIO}}</p>
			{{SOCIAL_LINKS}}
		</aside>
		<footer>{{WIDGET_EMBED}}</footer>
		<script src="script.js"></script>
	</body>
</html>
