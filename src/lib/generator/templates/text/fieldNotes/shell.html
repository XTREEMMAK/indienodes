<!doctype html>
<!--
	Field notebook: warm paper, tight measure, notes numbered as you go.

	Anything in double braces is filled in when the page is generated — your
	name, your work, your links — and is already gone by the time you have
	this file. Everything else is ordinary HTML: rearrange it, retitle it, or
	delete a section you do not want.

	Two things to leave alone: the verification meta tag in the head, which is
	how IndieNodes confirms this site is yours until your submission is
	approved, and the link to styles.css, which is where all the styling for
	this page lives.
-->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{{DISPLAY_NAME}}</title>
		{{VERIFICATION_META}} {{COLOR_OVERRIDE}}
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="layout-grid">
			<!-- The portrait and the bio live on about.html. A reading surface
			     reads better when the writing is the only thing competing for
			     the top of the page; the link below is how someone gets to the
			     person behind it. -->
			<header class="profile-header">
				<div class="bio-text">
					<h1>{{DISPLAY_NAME}}</h1>
					<p class="site-nav"><a href="about.html">About {{DISPLAY_NAME}}</a></p>
				</div>
			</header>

			<main>
				<span class="section-label">Index // Recent Text</span>

				{{WORKS}}

				<!-- COMMENTED EXTRA FOR TEXT: RSS SUBSCRIBER BOX -->
				<!--
      <div class="extra-block">
        <strong style="color: var(--accent);">RSS FEED:</strong>
        <p style="font-family: system-ui, sans-serif; font-size: 0.9rem; margin-top: 5px;">Copy feed URL: <code>https://example.com/feed.xml</code></p>
      </div>
      -->

				<!-- COMMENTED EXTRA FOR TEXT: BOOK PREORDERS -->
				<!--
      <div class="extra-block">
        <strong style="color: var(--accent);">NEW PUBLICATION:</strong>
        <p style="font-family: system-ui, sans-serif; font-size: 0.9rem; margin-top: 5px;">"Digital Solitude" (Physical Paperback) available for order.</p>
      </div>
      --></main>

			{{SOCIAL_LINKS}}

			<footer>
				<div class="indienodes-box">{{WIDGET_EMBED}}</div>
			</footer>
		</div>
	</body>
</html>
