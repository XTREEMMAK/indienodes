<!doctype html>
<!--
	Reading archive: essays listed as dated cards on a dark ground, with a cyan rule marking each entry.

	Anything in double braces is filled in when the page is generated — your
	name, your work, your links — and is already gone by the time you have
	this file. Everything else is ordinary HTML: rearrange it, retitle it, or
	delete a section you do not want.

	Two things to leave alone: the verification meta tag in the head, which is
	how IndieNodes confirms this site is yours until your submission is
	approved, and the link to styles.css, which is where all the styling for
	this page lives.
-->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{{DISPLAY_NAME}}</title>
		{{VERIFICATION_META}} {{COLOR_OVERRIDE}}
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="container">
			<!-- The portrait and the bio live on about.html. A reading surface
			     reads better when the writing is the only thing competing for
			     the top of the page; the link below is how someone gets to the
			     person behind it. -->
			<header class="author-grid">
				<div class="author-bio">
					<h1>{{DISPLAY_NAME}}</h1>
					<p class="site-nav"><a href="about.html">About {{DISPLAY_NAME}}</a></p>
				</div>
			</header>

			<main>
				<div
					style="
						font-size: 0.85rem;
						color: var(--text-dim);
						margin-bottom: 25px;
						letter-spacing: 2px;
					"
				>
					INDEX // SELECTED WRITINGS
				</div>

				<div class="article-feed">{{WORKS}}</div>

				<!-- EXTRAS FOR TEXT: Uncomment for RSS Feed Box -->
				<!--
      <div class="extra-box">
        <p style="color: var(--cyan); font-weight: bold;">RSS FEED SUBSCRIPTION</p>
        <p>Feed URL: <code>https://example.com/rss.xml</code></p>
      </div>
      --></main>

			{{SOCIAL_LINKS}}

			<footer>
				<div class="indienodes-ring">{{WIDGET_EMBED}}</div>
			</footer>
		</div>
	</body>
</html>
