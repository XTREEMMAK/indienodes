<!doctype html>
<!--
	Broadsheet: a masthead kicker over selected writing, set on a dark page.

	Anything in double braces is filled in when the page is generated — your
	name, your work, your links — and is already gone by the time you have
	this file. Everything else is ordinary HTML: rearrange it, retitle it, or
	delete a section you do not want.

	Two things to leave alone: the verification meta tag in the head, which is
	how IndieNodes confirms this site is yours until your submission is
	approved, and the link to styles.css, which is where all the styling for
	this page lives.
-->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{{DISPLAY_NAME}}</title>
		{{VERIFICATION_META}} {{COLOR_OVERRIDE}}
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="editorial-page">
			<!-- The portrait and the bio live on about.html. A reading surface
			     reads better when the writing is the only thing competing for
			     the top of the page; the link below is how someone gets to the
			     person behind it. -->
			<header class="author-header">
				<div class="author-meta">
					<span class="kicker">ESSAYS &amp; FICTION</span>
					<h1 class="author-name">{{DISPLAY_NAME}}</h1>
					<p class="site-nav"><a href="about.html">About {{DISPLAY_NAME}}</a></p>
				</div>
			</header>

			<hr class="divider" />

			<main class="writing-section">
				<h2 class="index-label">SELECTED WRITINGS</h2>

				<div class="essay-feed">{{WORKS}}</div>

				<!-- EXTRAS FOR TEXT: Uncomment below for RSS Feed or Book Preorders -->
				<!--
      <div class="text-extra-panel">
        <h4>RSS FEED SUBSCRIPTION</h4>
        <p>Subscribe via your RSS reader:</p>
        <code>https://example.com/rss.xml</code>
      </div>
      -->
				<!--
      <div class="text-extra-panel">
        <h4>UPCOMING BOOK</h4>
        <p><em>The Static Grid</em> (Physical Edition coming 2027)</p>
      </div>
      --></main>

			{{SOCIAL_LINKS}}

			<footer>
				<div class="indienodes-text">{{WIDGET_EMBED}}</div>
			</footer>
		</div>
	</body>
</html>
