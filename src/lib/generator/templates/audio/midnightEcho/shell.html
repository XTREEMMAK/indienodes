<!doctype html>
<!--
	Dark record page: custom track players on near-black, with a purple accent and cyan/pink highlights.

	Anything in double braces is filled in when the page is generated — your
	name, your work, your links — and is already gone by the time you have
	this file. Everything else is ordinary HTML: rearrange it, retitle it, or
	delete a section you do not want.

	Two things to leave alone: the verification meta tag in the head, which is
	how IndieNodes confirms this site is yours until your submission is
	approved, and the link to styles.css, which is where all the styling for
	this page lives.
-->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{{DISPLAY_NAME}}</title>
		{{VERIFICATION_META}} {{COLOR_OVERRIDE}}
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="wrapper">
			<header class="hifi-deck">
				<div class="artist-profile">
					<div class="avatar-wrapper">
						{{ICON}}
						<div class="now-playing-badge">ON AIR</div>
					</div>
					<div class="artist-details">
						<h1>{{DISPLAY_NAME}}</h1>
						<p>{{BIO}}</p>
						<div class="equalizer-bar-group">
							<div class="eq-bar"></div>
							<div class="eq-bar"></div>
							<div class="eq-bar"></div>
							<div class="eq-bar"></div>
							<div class="eq-bar"></div>
						</div>
					</div>
				</div>
			</header>

			<main>
				<h2 class="section-title">Latest Releases</h2>
				<div class="track-grid">{{WORKS}}</div>

			{{SOCIAL_LINKS}}
