<!doctype html>
<!--
	Gig-poster brutalism: a scrolling banner across the top, oversized type, hard shadows and no rounded corners anywhere.

	Anything in double braces is filled in when the page is generated — your
	name, your work, your links — and is already gone by the time you have
	this file. Everything else is ordinary HTML: rearrange it, retitle it, or
	delete a section you do not want.

	Two things to leave alone: the verification meta tag in the head, which is
	how IndieNodes confirms this site is yours until your submission is
	approved, and the link to styles.css, which is where all the styling for
	this page lives.
-->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{{DISPLAY_NAME}}</title>
		{{VERIFICATION_META}} {{COLOR_OVERRIDE}}
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="poster-wrapper">
			<!-- Scrolling banner. The two spans are identical on purpose: the
			     track slides left by exactly one of them and then resets, so
			     the copy arriving is already the copy leaving and the loop has
			     no seam. Editing one means editing both. -->
			<div class="ticker" style="--ticker-duration: {{TICKER_DURATION}}s">
				<div class="ticker-track">
					<span>{{TICKER_MESSAGE}}</span>
					<span>{{TICKER_MESSAGE}}</span>
				</div>
			</div>

			<header class="poster-hero">
				<div class="frame-container">
					{{ICON}}
					<div class="badge">LIVE / RAW</div>
				</div>
				<div class="hero-text">
					<h1 class="giant-title">{{DISPLAY_NAME}}</h1>
					<p class="bio-text">{{BIO}}</p>
				</div>
			</header>

			<section class="music-section">
				<h2 class="block-head">AUDIO DROPS</h2>
				<div class="tracklist">{{WORKS}}</div>

				<!-- EXTRAS FOR MUSIC: Uncomment below for Tour Schedule or Merch -->
				<!--
      <div class="music-extra-box">
        <h3 class="extra-head">// TOUR DATES</h3>
        <div class="tour-line"><span>NOV 12</span> <span>THE METRO</span> <span>CHICAGO, IL</span></div>
        <div class="tour-line"><span>NOV 15</span> <span>FIRST AVENUE</span> <span>MINNEAPOLIS, MN</span></div>
      </div>
      -->
				<!--
      <div class="music-extra-box">
        <h3 class="extra-head">// MERCH DROPS</h3>
        <div class="merch-flex">
          <div><strong>EP VINYL LP</strong> : $25</div>
          <div><strong>TOUR HOODIE</strong> : $45</div>
        </div>
      </div>
      --></section>

			{{SOCIAL_LINKS}}

			<footer>
				<div class="indienodes-music">{{WIDGET_EMBED}}</div>
			</footer>
		</div>
	</body>
</html>
