<!doctype html>
<!--
	Neon night: a translucent card stack over a deep violet ground, lit by a large circle of glow behind the page that the creator can recolour and set moving.

	Anything in double braces is filled in when the page is generated — your
	name, your work, your links — and is already gone by the time you have
	this file. Everything else is ordinary HTML: rearrange it, retitle it, or
	delete a section you do not want.

	Two things to leave alone: the verification meta tag in the head, which is
	how IndieNodes confirms this site is yours until your submission is
	approved, and the link to styles.css, which is where all the styling for
	this page lives.
-->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{{DISPLAY_NAME}}</title>
		{{VERIFICATION_META}} {{COLOR_OVERRIDE}}
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body class="{{BODY_CLASS}}">
		<div class="container">
			<header class="hero-deck">
				<div class="avatar-deck">
					<div class="avatar-ring"></div>
					{{ICON}}
				</div>
				<div class="hero-info">
					<h1>{{DISPLAY_NAME}}</h1>
					<p>{{BIO}}</p>
					<div class="eq-wave">
						<div class="eq-bar"></div>
						<div class="eq-bar"></div>
						<div class="eq-bar"></div>
						<div class="eq-bar"></div>
						<div class="eq-bar"></div>
					</div>
				</div>
			</header>

			<main>
				<h2 style="margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px">
					Featured Audio Tracks
				</h2>
				<div class="track-grid">{{WORKS}}</div>

				<!-- EXTRAS FOR MUSIC: Uncomment for Tour Schedule or Merch -->
				<!--
      <div class="extra-box">
        <h3 style="color: var(--neon-cyan); margin-bottom: 10px;">Live Gig Schedule</h3>
        <p>Nov 12, 2026 : Cyberdome Chicago : Session 01</p>
        <p>Nov 18, 2026 : Electro Vault NYC : Session 04</p>
      </div>
      --></main>

			{{SOCIAL_LINKS}}

			<footer>
				<div class="indienodes-ring">{{WIDGET_EMBED}}</div>
			</footer>
		</div>
	</body>
</html>
