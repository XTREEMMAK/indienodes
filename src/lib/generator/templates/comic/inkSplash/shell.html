<!doctype html>
<!--
	Comic-book poster: halftone yellow and blue on off-white newsprint, pages shown large.

	Anything in double braces is filled in when the page is generated — your
	name, your work, your links — and is already gone by the time you have
	this file. Everything else is ordinary HTML: rearrange it, retitle it, or
	delete a section you do not want.

	Two things to leave alone: the verification meta tag in the head, which is
	how IndieNodes confirms this site is yours until your submission is
	approved, and the link to styles.css, which is where all the styling for
	this page lives.
-->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{{DISPLAY_NAME}}</title>
		{{VERIFICATION_META}} {{COLOR_OVERRIDE}}
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="comic-page">
			<header class="comic-hero">
				<div class="avatar-bubble">{{ICON}}</div>
				<div class="speech-bubble">
					<h1>{{DISPLAY_NAME}}</h1>
					<p>{{BIO}}</p>
				</div>
			</header>

			<main class="comic-display">
				{{WORKS}}

				<!-- EXTRAS FOR COMICS: Uncomment below for Conventions or Merch -->
				<!--
      <div class="comic-extra-card">
        <h3>CONVENTION APPEARANCES</h3>
        <ul>
          <li><strong>COMIC CON 2026:</strong> BOOTH 402 (OCT 12 to 14)</li>
          <li><strong>ZINE FEST:</strong> TABLE 12 (NOV 02)</li>
        </ul>
      </div>
      -->
				<!--
      <div class="comic-extra-card">
        <h3>PRINT SHOP</h3>
        <p>VOL 1 PAPERBACK AVAILABLE NOW ($15)</p>
      </div>
      --></main>

			{{SOCIAL_LINKS}}

			<footer>
				<div class="indienodes-comic">{{WIDGET_EMBED}}</div>
			</footer>
		</div>
	</body>
</html>
