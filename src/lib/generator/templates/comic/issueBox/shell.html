<!doctype html>
<!--
	Issue listing: pages boxed on a near-black shelf, with one hot-pink accent.

	Anything in double braces is filled in when the page is generated — your
	name, your work, your links — and is already gone by the time you have
	this file. Everything else is ordinary HTML: rearrange it, retitle it, or
	delete a section you do not want.

	Two things to leave alone: the verification meta tag in the head, which is
	how IndieNodes confirms this site is yours until your submission is
	approved, and the link to styles.css, which is where all the styling for
	this page lives.
-->
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{{DISPLAY_NAME}}</title>
		{{VERIFICATION_META}} {{COLOR_OVERRIDE}}
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="container">
			<header class="hero-banner">
				<div class="avatar-frame">{{ICON}}</div>
				<div class="bio-content">
					<h1>{{DISPLAY_NAME}}</h1>
					<p>{{BIO}}</p>
				</div>
			</header>

			<main class="chapter-viewer">
				{{WORKS}}

      -->

			{{SOCIAL_LINKS}}

	</body>
</html>
