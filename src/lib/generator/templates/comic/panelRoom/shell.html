<!doctype html>
<!--
	Printed-comic reading, not an image gallery: thick ink-black panel borders on a pale newsprint ground, with one Ben-Day red reserved for captions and the page counter.

	Anything in double braces is filled in when the page is generated — your
	name, your work, your links — and is already gone by the time you have
	this file. Everything else is ordinary HTML: rearrange it, retitle it, or
	delete a section you do not want.

	Two things to leave alone: the verification meta tag in the head, which is
	how IndieNodes confirms this site is yours until your submission is
	approved, and the link to styles.css, which is where all the styling for
	this page lives.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		{{VERIFICATION_META}}
		<title>{{DISPLAY_NAME}}</title>
		<link rel="stylesheet" href="styles.css" />
		{{COLOR_OVERRIDE}}
	</head>
	<body>
		<header class="masthead">
			{{ICON}}
			<div>
				<h1>{{DISPLAY_NAME}}</h1>
				<p class="tagline">{{WHY}}</p>
			</div>
		</header>

		<main class="pages">{{PANELS}}</main>

		{{SOCIAL_LINKS}}

		<footer>
			<p>Self-published. Nothing here is rehosted.</p>
			{{WIDGET_EMBED}}
		</footer>

		<div class="lightbox" id="lightbox" hidden>
			<button type="button" class="lightbox-close" aria-label="Close">&times;</button>
			<img id="lightbox-img" src="" alt="" />
		</div>
		<script src="script.js"></script>
	</body>
</html>
