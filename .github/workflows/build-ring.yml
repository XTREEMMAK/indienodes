# Keeps ring.json in sync with members/*.json automatically. ring.json is a
# generated artifact (scripts/build-ring.js) and validate-ring.yml's
# validate:publish check compares it byte-for-byte against the real Prettier
# output (scripts/validate-ring.js) - nothing outside that exact toolchain
# can regenerate it correctly, including a bot committing a PR. This exists
# so neither a human nor the n8n submission workflow has to remember to run
# `npm run ring:build` by hand before every PR touching members/*.json.
#
# Restricted to same-repo branches on purpose: a fork PR's branch can't be
# pushed to by this repo's GITHUB_TOKEN anyway, and auto-committing based on
# an external contributor's PR content without review first is exactly the
# "pwn request" pattern GitHub's own Actions security guidance warns against.
# n8n only ever opens PRs from branches in this repo, so this still covers
# the case that actually needs it.

name: Auto-build ring.json

on:
  pull_request:
    paths:
      - 'members/**.json'

permissions:
  contents: write

jobs:
  build-ring:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run ring:build

      - name: Commit regenerated ring.json if it changed
        run: |
          if ! git diff --quiet -- ring.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ring.json
            git commit -m "chore: regenerate ring.json from members/*.json"
            git push
          fi
