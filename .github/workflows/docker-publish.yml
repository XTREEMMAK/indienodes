# Builds and publishes the static-site image described in the Dockerfile.
# Structurally modeled on the sibling GGRequestz project's own publish
# workflow (buildx/QEMU/GHCR/metadata-action shape), trimmed of everything
# that was really about adapter-node: no .env.docker-build placeholder file,
# no PM2, no production-only npm install, no database migrations to copy in.
# This image has nothing to configure at deploy time beyond the VITE_ build
# args below, because adapter-static bakes everything else in.
#
# That list must stay in step with the Dockerfile's own ARG block, which is
# the definitive set. It has now drifted behind it twice: once when Contact
# and Turnstile shipped in 0.11.0, and again after v1.0 prep fixed the
# Dockerfile without fixing this file, which published images whose contact
# form reported no backend, whose forms had no Turnstile control, and whose
# About modal had no Support tab.

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Runs the full check/lint/unit/e2e suite from ci.yml. Called rather than
  # duplicated, so there is one definition of "passing".
  #
  # On a pull request this means the suite runs twice: once as ci.yml's own
  # run (which is what branch protection marks required) and once here. That
  # is a known, accepted cost rather than an oversight — the alternative is
  # dropping this workflow's pull_request trigger, which would give up
  # catching a broken Dockerfile before merge, and a few CI minutes are
  # cheaper than that.
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    runs-on: ubuntu-latest
    # No image reaches the registry without that suite passing. Before this
    # existed, every merge to main published one unconditionally.
    needs: ci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SITE_ORIGIN=${{ vars.VITE_SITE_ORIGIN || 'https://indienodes.us' }}
            VITE_SUBMISSION_WEBHOOK_URL=${{ vars.VITE_SUBMISSION_WEBHOOK_URL }}
            VITE_CONTACT_WEBHOOK_URL=${{ vars.VITE_CONTACT_WEBHOOK_URL }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
            VITE_KOFI_URL=${{ vars.VITE_KOFI_URL }}
          # Unset is a supported state for all but the origin: no submission
          # webhook means a build reports submissions closed rather than
          # dropping them, no contact webhook does the same for /contact, no
          # Turnstile key means the widget does not render, and no Ko-fi URL
          # drops the About modal's Support tab. Unset silently is the
          # problem, which is why they are listed here even when empty.
          #
          # All five are compiled into the public client bundle, not read at
          # container runtime (see Dockerfile, src/lib/config.js) — the
          # webhook URL belongs in a repository VARIABLE, never a secret.
          # Filing it as a secret would suggest its exposure matters, when
          # every abuse control that actually protects the submission
          # workflow already lives server-side, not in keeping this URL
          # hidden (see docs/decisions.md).
